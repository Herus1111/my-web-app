server.port=${PORT:8080}

spring.application.name=Growdent
#Port in docker-compose.yml konfiguriert
#/growdent konfiguriert in Zeile POSTGRES_DB: growdent
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://db:5432/growdent}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:growdent}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}

spring.datasource.driver-class-name=org.postgresql.Driver
#update statt create-drop, damit die Daten beim Neustart erhalten bleiben
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
# Fuer die Bilder vom Event/Profilbild das Limit fuer einen Request anheben
# Die maximale Groesse einer einzelnen Datei (z.B. 10 Megabyte)
spring.servlet.multipart.max-file-size=10MB

# Die maximale Groesse des gesamten Upload-Requests (inklusive Daten)
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}