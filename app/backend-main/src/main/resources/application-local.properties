# Ueberschreibt die Verbindungs-URL fuer den lokalen Start (Port 5332 wie in docker-compose)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5332/growdent}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:growdent}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}